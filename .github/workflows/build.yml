name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

# one run per branch at a time - a newer push cancels the older run, so it cannot finish last and overwrite the
# newer images
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: bfren/docker/.github/workflows/build-bin.yml@main
    with:
      image: figlet
      build-args: |
        FIGLET=2.2.5
      tags: |
        2.2.5-${VERSION}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
